<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){
      try {
        const u = JSON.parse(localStorage.getItem('sb_current_user') || 'null');
        if (!u) {
          localStorage.setItem('sb_show_login', '1');
          window.location.href = 'simplebanking.html#features';
        }
      } catch(e){}
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Beneficiaries - SimpleBank</title>
  <link rel="stylesheet" href="simplebanking.css">
  <style>
    main.beneficiaries {
      padding: 1.25rem;
      max-width: 800px;
      margin: 1.5rem auto;
    }
    .card {
      background: #fff;
      padding: 1.25rem;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(16,185,129,0.06);
    }
    .btn-primary {
      background: #10b981;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin-bottom: 1.5rem;
      font-size: 1rem;
      transition: background 0.3s;
    }
    .btn-primary:hover {
      background: #059669;
    }
    .beneficiary-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .beneficiary-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: #f9fafb;
      border-radius: 8px;
      border-left: 4px solid #10b981;
    }
    .beneficiary-info {
      flex: 1;
    }
    .beneficiary-name {
      font-weight: 600;
      color: #374151;
      font-size: 1rem;
    }
    .beneficiary-details {
      font-size: 0.9rem;
      color: #6b7280;
      margin-top: 0.25rem;
    }
    .beneficiary-actions {
      display: flex;
      gap: 0.5rem;
    }
    .btn-small {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
    }
    .btn-send {
      background: #3b82f6;
      color: white;
    }
    .btn-send:hover {
      background: #2563eb;
    }
    .btn-delete {
      background: #ef4444;
      color: white;
    }
    .btn-delete:hover {
      background: #dc2626;
    }
    .empty-state {
      text-align: center;
      padding: 2rem;
      color: #6b7280;
    }
    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }
    .modal-content h3 {
      margin-top: 0;
      margin-bottom: 1rem;
      color: #374151;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #374151;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .success-msg {
      color: #10b981;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .modal-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .modal-buttons button {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-confirm {
      background: #10b981;
      color: white;
    }
    .btn-cancel {
      background: #e5e7eb;
      color: #374151;
    }
    @media (max-width:600px) {
      main.beneficiaries { padding:1rem; margin:1rem; }
      .beneficiary-item { flex-direction: column; gap:0.75rem; align-items:flex-start; }
      .beneficiary-actions { width:100%; }
      .btn-small { flex:1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">TBanking</div>
    <nav>
      <a href="index.html#features">Home</a>
      <a href="wallet.html">Wallet</a>
      <a href="send-money.html">Send Money</a>
    </nav>
  </header>

  <main class="beneficiaries">
    <h1>Saved Beneficiaries</h1>
    <p style="color:#6b7280; margin-bottom:1.5rem;">Manage your saved recipients for quick transfers</p>

    <button class="btn-primary" id="addBeneficiaryBtn">+ Add New Beneficiary</button>

    <section class="card">
      <div class="beneficiary-list" id="beneficiaryList">
        <div class="empty-state">
          <div class="empty-state-icon">👥</div>
          <p>No saved beneficiaries yet</p>
          <p style="font-size:0.9rem;">Add beneficiaries to make quick transfers</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Add Beneficiary Modal -->
  <div class="modal-overlay" id="addBeneficiaryModal">
    <div class="modal-content">
      <h3>Add New Beneficiary</h3>
      <div class="form-group">
        <label for="benName">Recipient Name</label>
        <input type="text" id="benName" placeholder="Enter recipient name">
      </div>
      <div class="form-group">
        <label for="benBank">Bank Name</label>
        <input type="text" id="benBank" placeholder="e.g., GTBank, Access Bank">
      </div>
      <div class="form-group">
        <label for="benAccount">Account Number</label>
        <input type="text" id="benAccount" placeholder="Enter 10-digit account number" maxlength="10" inputmode="numeric">
      </div>
      <div class="form-group">
        <label for="benNickname">Nickname (Optional)</label>
        <input type="text" id="benNickname" placeholder="e.g., Brother, Mom">
      </div>
      <div class="error-msg" id="benError"></div>
      <div class="success-msg" id="benSuccess"></div>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal('addBeneficiaryModal')">Cancel</button>
        <button class="btn-confirm" id="saveBeneficiaryBtn">Add Beneficiary</button>
      </div>
    </div>
  </div>

  <!-- Send Money Modal -->
  <div class="modal-overlay" id="sendToBeneficiaryModal">
    <div class="modal-content">
      <h3>Send Money to <span id="benSendName"></span></h3>
      <div class="form-group">
        <label for="sendAmount">Amount</label>
        <input type="number" id="sendAmount" placeholder="₦0.00" min="1" step="0.01">
      </div>
      <div class="form-group">
        <label for="sendPin">PIN</label>
        <input type="password" id="sendPin" placeholder="••••" maxlength="6" inputmode="numeric">
      </div>
      <div class="error-msg" id="sendError"></div>
      <div style="background:#f0fdf4; padding:0.75rem; border-radius:6px; margin-bottom:1rem;">
        <div style="font-size:0.9rem; color:#6b7280;">Your balance: <strong id="sendBalance">₦0</strong></div>
      </div>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal('sendToBeneficiaryModal')">Cancel</button>
        <button class="btn-confirm" id="confirmSendBtn">Send Money</button>
      </div>
    </div>
  </div>

  <script>
    // Load beneficiaries
    function getBeneficiaries() {
      try {
        const cur = JSON.parse(localStorage.getItem('sb_current_user') || 'null');
        if (!cur) return [];
        const key = 'sb_beneficiaries_' + cur.accountNumber;
        return JSON.parse(localStorage.getItem(key) || '[]');
      } catch(e) {
        return [];
      }
    }

    function saveBeneficiaries(beneficiaries) {
      try {
        const cur = JSON.parse(localStorage.getItem('sb_current_user') || 'null');
        if (cur) {
          const key = 'sb_beneficiaries_' + cur.accountNumber;
          localStorage.setItem(key, JSON.stringify(beneficiaries));
        }
      } catch(e) {}
    }

    function renderBeneficiaries() {
      const beneficiaries = getBeneficiaries();
      const container = document.getElementById('beneficiaryList');

      if (beneficiaries.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">👥</div>
            <p>No saved beneficiaries yet</p>
            <p style="font-size:0.9rem;">Add beneficiaries to make quick transfers</p>
          </div>
        `;
        return;
      }

      container.innerHTML = beneficiaries.map((ben, idx) => `
        <div class="beneficiary-item">
          <div class="beneficiary-info">
            <div class="beneficiary-name">${ben.nickname || ben.name}</div>
            <div class="beneficiary-details">${ben.bank} • ${ben.account}</div>
          </div>
          <div class="beneficiary-actions">
            <button class="btn-small btn-send" onclick="openSendModal(${idx})">Send</button>
            <button class="btn-small btn-delete" onclick="deleteBeneficiary(${idx})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function openModal(modalId) {
      document.getElementById(modalId).classList.add('active');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
      const errorDiv = document.getElementById(modalId.replace('Modal', '') + 'Error');
      if (errorDiv) errorDiv.textContent = '';
    }

    // Add Beneficiary
    document.getElementById('addBeneficiaryBtn').addEventListener('click', () => {
      document.getElementById('benName').value = '';
      document.getElementById('benBank').value = '';
      document.getElementById('benAccount').value = '';
      document.getElementById('benNickname').value = '';
      document.getElementById('benError').textContent = '';
      openModal('addBeneficiaryModal');
    });

    document.getElementById('saveBeneficiaryBtn').addEventListener('click', () => {
      const name = document.getElementById('benName').value.trim();
      const bank = document.getElementById('benBank').value.trim();
      const account = document.getElementById('benAccount').value.trim();
      const nickname = document.getElementById('benNickname').value.trim();
      const errorDiv = document.getElementById('benError');
      errorDiv.textContent = '';

      if (!name || !bank || !account) {
        errorDiv.textContent = 'Please fill in all required fields';
        return;
      }

      if (account.length !== 10 || isNaN(account)) {
        errorDiv.textContent = 'Account number must be 10 digits';
        return;
      }

      const beneficiaries = getBeneficiaries();
      const beneficiary = {
        id: 'ben_' + Date.now(),
        name,
        bank,
        account,
        nickname: nickname || name,
        dateAdded: new Date().toISOString()
      };

      beneficiaries.push(beneficiary);
      saveBeneficiaries(beneficiaries);
      renderBeneficiaries();
      closeModal('addBeneficiaryModal');
    });

    // Delete Beneficiary
    function deleteBeneficiary(idx) {
      if (confirm('Are you sure you want to delete this beneficiary?')) {
        const beneficiaries = getBeneficiaries();
        beneficiaries.splice(idx, 1);
        saveBeneficiaries(beneficiaries);
        renderBeneficiaries();
      }
    }

    // Send to Beneficiary
    let selectedBeneficiaryIdx = -1;

    function openSendModal(idx) {
      selectedBeneficiaryIdx = idx;
      const beneficiaries = getBeneficiaries();
      const ben = beneficiaries[idx];
      document.getElementById('benSendName').textContent = ben.nickname || ben.name;
      document.getElementById('sendAmount').value = '';
      document.getElementById('sendPin').value = '';
      document.getElementById('sendError').textContent = '';

      try {
        const cur = JSON.parse(localStorage.getItem('sb_current_user') || 'null');
        const balance = Number(cur?.balance || 0);
        document.getElementById('sendBalance').textContent = '₦' + balance.toLocaleString();
      } catch(e) {}

      openModal('sendToBeneficiaryModal');
    }

    document.getElementById('confirmSendBtn').addEventListener('click', () => {
      const amount = parseFloat(document.getElementById('sendAmount').value);
      const pin = document.getElementById('sendPin').value;
      const errorDiv = document.getElementById('sendError');
      errorDiv.textContent = '';

      if (!amount || amount <= 0) {
        errorDiv.textContent = 'Please enter a valid amount';
        return;
      }

      if (!pin || pin.length !== 6) {
        errorDiv.textContent = 'Please enter your 6-digit PIN';
        return;
      }

      try {
        const cur = JSON.parse(localStorage.getItem('sb_current_user') || 'null');
        if (!cur || String(cur.pin) !== String(pin)) {
          errorDiv.textContent = 'Invalid PIN';
          return;
        }

        if (Number(cur.balance) < amount) {
          errorDiv.textContent = 'Insufficient balance';
          return;
        }

        // Process transaction
        const beneficiaries = getBeneficiaries();
        const ben = beneficiaries[selectedBeneficiaryIdx];

        // Record transaction
        const tx = {
          id: 'tx_' + Date.now(),
          type: 'debit',
          title: 'Send Money',
          description: `To ${ben.name} (${ben.account}) - ${ben.bank}`,
          amount: amount,
          date: new Date().toISOString(),
          icon: '↑'
        };

        const txKey = 'sb_transactions_' + cur.accountNumber;
        const txs = JSON.parse(localStorage.getItem(txKey) || '[]');
        txs.unshift(tx);
        localStorage.setItem(txKey, JSON.stringify(txs));

        // Update balance
        cur.balance = Number(cur.balance) - amount;
        localStorage.setItem('sb_current_user', JSON.stringify(cur));

        const users = JSON.parse(localStorage.getItem('sb_users') || '[]');
        const idx = users.findIndex(u => u.user === cur.user);
        if (idx >= 0) {
          users[idx].balance = cur.balance;
          localStorage.setItem('sb_users', JSON.stringify(users));
        }

        alert('Money sent successfully!');
        closeModal('sendToBeneficiaryModal');
      } catch(e) {
        errorDiv.textContent = 'Error processing transaction';
      }
    });

    // Initial render
    renderBeneficiaries();
  </script>
</body>
</html>
